# Omni Demo 远程推理部署 (docker compose)
#
# 参考示例：单 endpoint、2 并发席位 + gateway。
# 多 endpoint / 灵活并发数部署请使用 start.sh。
#
# 架构：
#   gateway  x1   :8006   torch-free 控制面（/v1/realtime 入口 + 调度 + 录制）
#   worker   xN   纯转发，每个容器 = 1 并发席位，指向外部推理服务
#
# 增减并发 = 增删 worker-N service 并同步 gateway 的 --workers 列表。
#
# 用法：
#   BACKEND_SERVER_URL=http://host:18900 docker compose up -d --build
#   docker compose logs -f gateway

x-worker: &worker-base
  build:
    context: .
    dockerfile: docker/Dockerfile.worker
  image: omni-demo-worker:dev
  environment:
    BACKEND_SERVER_URL: ${BACKEND_SERVER_URL:?set BACKEND_SERVER_URL}
    WORKER_PORT: "22400"
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:22400/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}

services:
  worker-0:
    <<: *worker-base
    container_name: omni-worker-0

  worker-1:
    <<: *worker-base
    container_name: omni-worker-1

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: omni-demo-gateway:dev
    container_name: omni-gateway
    # HTTPS:实时音视频页面(omni/audio_duplex)需要 https —— 浏览器仅在 https/localhost
    # 下提供 navigator.mediaDevices(麦克风)。证书从宿主机挂载(不进镜像),默认读 certs/cert.pem。
    # 纯文字 /turnbased 不需要麦克风,http 也能用;要降级 http 把下面 --https 段换成 ["--http"]。
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8006"
      - "--https"
      - "--ssl-certfile"
      - "/app/certs/cert.pem"
      - "--ssl-keyfile"
      - "/app/certs/key.pem"
      - "--workers"
      - "worker-0:22400,worker-1:22400"
    ports:
      - "${GATEWAY_HOST_PORT:-8006}:8006"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data      # session 录制持久化到 host
      - ${CERTS_HOST_PATH:-./certs}:/app/certs:ro # TLS 证书从宿主机挂载(只读),不进镜像
    depends_on:
      worker-0:
        condition: service_healthy
      worker-1:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
