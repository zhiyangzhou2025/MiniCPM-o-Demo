<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Model — Multimodal Inference Service</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
            background: #f5f5f0;
            color: #2d2d2d;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header (same as demo pages) */
        .header {
            background: #fff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5e0;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 16px; font-weight: 600; color: #2d2d2d; letter-spacing: -0.3px; }
        .header .nav-links { display: flex; gap: 8px; }
        .header .nav-links a {
            font-size: 13px; padding: 4px 12px; border-radius: 6px;
            text-decoration: none; color: #666; transition: all 0.15s;
        }
        .header .nav-links a:hover { background: #f0f0eb; color: #2d2d2d; }
        .header .nav-links a.active { background: #2d2d2d; color: #fff; }
        .header .nav-links a:not(.active):focus { outline: none; }

        /* Main: centered mode cards */
        .home-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
            gap: 28px;
        }
        .home-title {
            font-size: 22px;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 8px;
        }
        .home-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
        }
        .resource-section {
            max-width: 960px;
            width: 100%;
            margin-top: -4px;
        }
        .resource-title {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 10px;
        }
        .resource-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .resource-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 999px;
            border: 1px solid #e5e5e0;
            background: #fff;
            color: #444;
            font-size: 13px;
            font-weight: 500;
            line-height: 1;
            text-decoration: none;
            transition: border-color .15s, box-shadow .15s, color .15s, transform .15s;
        }
        .resource-btn:hover {
            border-color: #c7c7bf;
            color: #111;
            box-shadow: 0 2px 10px rgba(0,0,0,.045);
            transform: translateY(-1px);
        }
        .resource-btn .platform-icon {
            font-size: 15px;
        }

        .mode-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            max-width: 960px;
            width: 100%;
        }
        .mode-card {
            width: 280px;
        }
        @media (max-width: 800px) {
            .mode-card { width: 100%; }
        }

        .mode-card {
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid #e5e5e0;
            border-radius: 16px;
            padding: 28px 24px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 200px;
        }
        .mode-card:hover {
            border-color: #999;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .mode-card .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 24px;
            flex-shrink: 0;
        }
        .mode-card.turnbased .card-icon { background: #e8e8e3; }
        .mode-card.omni .card-icon { background: #d4e4f7; }
        .mode-card.audio .card-icon { background: #e8f0e8; }
        .mode-card.mobile .card-icon { background: #f3e8ff; }
        .mode-card .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 8px;
        }
        .mode-card .card-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            flex: 1;
        }
        .mode-card .card-enter {
            font-size: 12px;
            color: #999;
            margin-top: 12px;
        }
        .mode-card:hover .card-enter { color: #2d2d2d; }

        /* Recent sessions */
        .recent-section {
            max-width: 960px;
            width: 100%;
            margin-top: 8px;
        }
        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .recent-title {
            font-size: 13px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .recent-clear {
            font-size: 12px;
            color: #bbb;
            border: none;
            background: none;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .recent-clear:hover { color: #888; background: #f0f0eb; }
        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #2d2d2d;
            font-size: 13px;
            transition: background 0.1s;
        }
        .recent-item:hover { background: #fff; }
        .recent-badge {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 500;
            white-space: nowrap;
        }
        .recent-badge.streaming { color: #1a7f37; background: #ddf4e4; }
        .recent-badge.chat { color: #92400e; background: #fef3c7; }
        .recent-badge.omni_duplex { color: #1e40af; background: #dbeafe; }
        .recent-badge.audio_duplex { color: #6d28d9; background: #ede9fe; }
        .recent-badge.unknown { color: #888; background: #eee; }
        .recent-id {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'SF Mono', Menlo, monospace;
            font-size: 12px;
            color: #555;
        }
        .recent-date {
            font-size: 11px;
            color: #bbb;
            white-space: nowrap;
        }
        .recent-empty {
            font-size: 13px;
            color: #ccc;
            text-align: center;
            padding: 12px;
        }

    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>Omni Model</h1>
            <div class="nav-links">
                <a href="/" class="active">Home</a>
            </div>
        </div>
        <div class="header-lang" id="headerLang"></div>
    </div>
    <style>
        .header-lang { display:flex; align-items:center; }
        .header-lang .hl-toggle { display:flex; background:#f0efec; border-radius:8px; padding:2px; gap:2px; }
        .header-lang .hl-btn { background:transparent; border:none; padding:4px 12px; font-size:11px; font-weight:600; color:#999; cursor:pointer; border-radius:6px; line-height:1.3; font-family:inherit; }
        .header-lang .hl-btn.active { background:#fff; color:#333; box-shadow:0 1px 3px rgba(0,0,0,.08); }
        .header-lang .hl-btn:not(.active):hover { color:#555; }
    </style>

    <main class="home-main">
        <div class="home-title" id="home-title">Choose mode</div>
        <!-- <div class="home-subtitle">Text · Image · Audio · Video — Multimodal inference</div> -->

        <div class="mode-cards" id="mode-cards"></div>

        <section class="resource-section" aria-labelledby="resource-heading">
            <div class="resource-title" id="resource-heading">Resources</div>
            <div class="resource-buttons">
                <a class="resource-btn" href="https://github.com/zhiyangzhou2025/vLLM-Omni-Demo" target="_blank" rel="noopener">
                    <span class="platform-icon" aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57L9 21.07c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.63-5.48 5.92.42.36.81 1.1.81 2.22l-.01 3.29c0 .31.2.69.82.57A12 12 0 0 0 12 .3"/>
                        </svg>
                    </span><span id="resource-demo">Demo Repo</span>
                </a>
                <a class="resource-btn" id="resource-docs-link" href="/docs/zh/">
                    <span class="platform-icon" aria-hidden="true">📘</span><span id="resource-docs">Docs</span>
                </a>
                <a class="resource-btn" id="resource-api-link" href="/docs/zh/realtime-api/overview/">
                    <span class="platform-icon" aria-hidden="true">⚡</span><span id="resource-api">API Docs</span>
                </a>
            </div>
        </section>

        <div class="recent-section" id="recent-section" style="display:none;">
            <div class="recent-header">
                <span class="recent-title" id="recent-title">Recent Sessions (Only visible to you)</span>
                <button class="recent-clear" id="recent-clear-btn"></button>
            </div>
            <div class="recent-list" id="recent-list"></div>
        </div>


    </main>

    <script src="/static/shared/i18n.js"></script>
    <script type="module">
    import { initNav } from '/static/shared/app-nav.js';
    const t = window.I18n?.t || {};

    const APP_CARD_META = {
        turnbased: { css: 'turnbased', icon: '💬', desc: t.turnbasedDesc, nameKey: 'turnbasedChat' },
        omni:      { css: 'omni',      icon: '🎥', desc: t.omniDesc, nameKey: 'omniFullDuplex' },
        audio_duplex: { css: 'audio', icon: '🎤', desc: t.audioDuplexDesc, nameKey: 'audioDuplexTitle' },
    };
    const MOBILE_PREVIEW_CARD = {
        route: '/mobile',
        css: 'mobile',
        icon: '📱',
        title: t.mobileName,
        desc: t.mobileDesc,
    };

    document.getElementById('home-title').textContent = t.chooseMode;
    document.getElementById('recent-title').textContent = t.recentSessions;
    document.getElementById('recent-clear-btn').textContent = t.clearRecent;
    document.getElementById('resource-heading').textContent = t.resources;
    document.getElementById('resource-demo').textContent = t.demoRepo;
    document.getElementById('resource-docs').textContent = t.docs;
    document.getElementById('resource-api').textContent = t.apiDocs;

    const currentLang = window.I18n.getLang();
    document.getElementById('resource-docs-link').href = `/docs/${currentLang}/`;
    document.getElementById('resource-api-link').href = `/docs/${currentLang}/realtime-api/overview/`;

    // Language toggle in header (FAQ-style)
    const _hlEl = document.getElementById('headerLang');
    if (_hlEl && window.I18n) {
        const _curLang = window.I18n.getLang();
        _hlEl.innerHTML = '<div class="hl-toggle">'
            + '<button class="hl-btn' + (_curLang === 'zh' ? ' active' : '') + '" data-l="zh">中文</button>'
            + '<button class="hl-btn' + (_curLang === 'en' ? ' active' : '') + '" data-l="en">EN</button>'
            + '</div>';
        _hlEl.addEventListener('click', e => {
            const btn = e.target.closest('.hl-btn');
            if (btn && !btn.classList.contains('active')) window.I18n.setLang(btn.dataset.l);
        });
    }

    function renderCard(card) {
        return `<a href="${card.route}" class="mode-card ${card.css}">
            <div class="card-icon" aria-hidden="true">${card.icon}</div>
            <div class="card-title">${card.title}</div>
            <div class="card-desc">${card.desc}</div>
            <div class="card-enter">${t.enter}</div>
        </a>`;
    }

    // Apps to hide from the homepage (kept available via direct route).
    const HIDDEN_APP_IDS = new Set([]);

    (async function() {
        const cardsEl = document.getElementById('mode-cards');
        const apps = await initNav(null);
        const appCards = apps ? apps
            .filter(a => !HIDDEN_APP_IDS.has(a.app_id))
            .map(a => {
                const m = APP_CARD_META[a.app_id] || { css: '', icon: '📦', desc: '' };
                return renderCard({
                    route: a.route,
                    css: m.css,
                    icon: m.icon,
                    title: (m.nameKey && t[m.nameKey]) || a.name,
                    desc: m.desc,
                });
            }) : [];

        cardsEl.innerHTML = [renderCard(MOBILE_PREVIEW_CARD), ...appCards].join('');
    })();

    (function() {
        const KEY = 'omni_recent_sessions';
        const section = document.getElementById('recent-section');
        const listEl = document.getElementById('recent-list');
        const clearBtn = document.getElementById('recent-clear-btn');

        function render() {
            let sessions = [];
            try { sessions = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch {}

            if (!sessions.length) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';

            listEl.innerHTML = sessions.map(function(s) {
                const d = new Date(s.savedAt);
                const dateStr = (d.getMonth()+1) + '/' + d.getDate() + ' '
                    + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
                const badgeType = s.appType || 'unknown';
                return '<a class="recent-item" href="/s/' + s.id + '" target="_blank" title="' + s.id + '">'
                    + '<span class="recent-badge ' + badgeType + '">' + badgeType.replace('_', ' ') + '</span>'
                    + '<span class="recent-id">' + s.id + '</span>'
                    + '<span class="recent-date">' + dateStr + '</span>'
                    + '</a>';
            }).join('');
        }

        clearBtn.addEventListener('click', function() {
            localStorage.removeItem(KEY);
            render();
        });

        render();
    })();
    </script>
</body>
</html>
